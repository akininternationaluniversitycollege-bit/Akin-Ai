<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Akin AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --user-msg: #3b82f6;
      --ai-msg: #334155;
      --text: #e2e8f0;
      --text-muted: #94a3b8;
      --border: #334155;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 24px;
    }
    h1 {
      font-size: 2.2rem;
      background: linear-gradient(90deg, #22d3ee, #3b82f6);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      font-weight: 800;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 6px;
    }
    #chat-container {
      height: 70vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 8px;
      margin-bottom: 20px;
    }
    .message {
      max-width: 85%;
      padding: 14px;
      border-radius: 18px;
      position: relative;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user {
      background: var(--user-msg);
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .assistant {
      background: var(--ai-msg);
      color: var(--text);
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .copy-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 6px;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .copy-btn:hover {
      color: white;
      background: rgba(255,255,255,0.1);
    }
    .input-area {
      display: flex;
      gap: 10px;
    }
    #user-input {
      flex: 1;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    #user-input:focus {
      border-color: #3b82f6;
    }
    #send-btn {
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 0 24px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    #send-btn:hover:not(:disabled) {
      background: #2563eb;
    }
    #send-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .typing {
      display: flex;
      align-self: flex-start;
      background: var(--ai-msg);
      padding: 14px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: var(--text-muted);
      border-radius: 50%;
      margin: 0 3px;
      animation: bounce 1.5s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    footer {
      text-align: center;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 0.8rem;
    }
    .empty {
      text-align: center;
      color: var(--text-muted);
      margin-top: 40%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Akin AI</h1>
    <div class="subtitle">Your kindred mind, powered by Llama 3</div>
  </header>

  <div id="chat-container">
    <div class="empty">
      <p>Ask me anything!</p>
      <p style="font-size: 0.85rem; margin-top: 8px;">e.g., "Explain quantum computing like I'm 12"</p>
    </div>
  </div>

  <form class="input-area" id="chat-form">
    <input
      type="text"
      id="user-input"
      placeholder="Message Akin AI..."
      autocomplete="off"
      required
    />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <footer>
    Powered by Llama 3 via Groq • Akin AI
  </footer>

  <script>
    // 🔑 REPLACE THIS WITH YOUR GROQ API KEY (for personal/local use only!)
    const GROQ_API_KEY ='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';

    // DOM Elements
    const chatContainer = document.getElementById('chat-container');
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    // Load chat history from localStorage
    let messages = JSON.parse(localStorage.getItem('akin_messages') || '[]');

    // Render existing messages
    function renderMessages() {
      chatContainer.innerHTML = '';
      if (messages.length === 0) {
        chatContainer.innerHTML = `
          <div class="empty">
            <p>Ask me anything!</p>
            <p style="font-size: 0.85rem; margin-top: 8px;">e.g., "Explain quantum computing like I'm 12"</p>
          </div>
        `;
        return;
      }
      messages.forEach(msg => {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${msg.role}`;
        msgDiv.textContent = msg.content;
        
        if (msg.role === 'assistant') {
          const copyBtn = document.createElement('button');
          copyBtn.className = 'copy-btn';
          copyBtn.textContent = 'Copy';
          copyBtn.onclick = () => navigator.clipboard.writeText(msg.content);
          msgDiv.appendChild(copyBtn);
        }
        
        chatContainer.appendChild(msgDiv);
      });
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // Add a new message
    function addMessage(role, content) {
      messages.push({ role, content });
      localStorage.setItem('akin_messages', JSON.stringify(messages));
      renderMessages();
    }

    // Send message to Groq
    async function sendMessage(prompt) {
      if (!GROQ_API_KEY || GROQ_API_KEY === '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') {
        alert('⚠️ Please add your Groq API key in the HTML file (line 140).');
        return;
      }

      // Show typing indicator
      const typingDiv = document.createElement('div');
      typingDiv.className = 'typing';
      typingDiv.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${GROQ_API_KEY}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            messages: [{ role: 'user', content: prompt }],
            model: 'llama3-8b-8192',
            temperature: 0.7,
            max_tokens: 1024
          })
        });

        const data = await response.json();
        typingDiv.remove();

        if (data.error) {
          throw new Error(data.error.message || 'API error');
        }

        const reply = data.choices[0]?.message?.content || 'No response.';
        addMessage('assistant', reply);
      } catch (error) {
        typingDiv.remove();
        console.error('Error:', error);
        addMessage('assistant', '⚠️ Failed to reach AI. Check your API key or network.');
      }
    }

    // Handle form submit
    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const prompt = userInput.value.trim();
      if (!prompt) return;

      addMessage('user', prompt);
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;

      sendMessage(prompt).finally(() => {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      });
    });

    // Initialize
    renderMessages();
    userInput.focus();
  </script>
</body>
</html>
